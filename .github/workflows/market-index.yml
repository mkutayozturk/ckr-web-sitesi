name: CKR official market data check
on:
  schedule:
    - cron: '30 8 * * *' # 11:30 Europe/Istanbul (UTC+3)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/market-index.yml']
permissions: {}
concurrency:
  group: ckr-market-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger server adapters and verify persisted provider results
        run: |
          python -u - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          def successful_today(job, stamp):
              try:
                  success = datetime.fromisoformat(job["last_successful_check_at"])
                  attempt = datetime.fromisoformat(job["last_attempt_at"])
                  lease = datetime.fromisoformat(job["running_until"])
                  if any(value.tzinfo is None for value in (success, attempt, lease, stamp)):
                      return False
                  return (job.get("status") == "ok"
                          and success.astimezone(ZoneInfo("Europe/Istanbul")).date() == stamp.astimezone(ZoneInfo("Europe/Istanbul")).date()
                          and attempt <= success <= stamp and lease <= stamp)
              except (KeyError, ValueError, TypeError):
                  return False
          url = 'https://ckr-backend.onrender.com/api/market/index'
          expected = {'tuik_sales','tcmb_kfe','tcmb_rent','tcmb_appraisal','tuik_cpi'}
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'CKR-GitHub-Daily-Check/1.0'}), timeout=50) as response:
                      data = json.load(response)
                  if not data.get('observations'):
                      raise ValueError('No verified cached observations returned')
                  jobs = {j['provider']:j for j in data.get('checks',[])}
                  stamp = datetime.now(timezone.utc)
                  good = {name for name,j in jobs.items() if successful_today(j, stamp)}
                  print(json.dumps({'attempt':attempt+1,'observations':len(data['observations']),'providers':{k:{'status':v.get('status'),'last_successful_check_at':v.get('last_successful_check_at'),'error':v.get('error')} for k,v in jobs.items()}}))
                  if expected <= good:
                      print('All five independent official-data adapters have persisted successful checks for today in Europe/Istanbul.')
                      break
              except Exception as exc:
                  print(type(exc).__name__ + ': ' + str(exc)[:200])
              if attempt == 11:
                  raise SystemExit('One or more official providers could not be verified; previous published data remains intact.')
              time.sleep(20)
          PY
